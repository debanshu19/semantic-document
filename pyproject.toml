[project]
name = "semantic-doc"
version = "0.1.0"
description = "Semantic Document (.sdoc) - immutable, locally-searchable document snapshots"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# sentence-transformers (the app's one and only embedding backend) is
# deliberately NOT declared as a dependency or uv extra here: uv resolves
# lockfiles across *all* declared extras regardless of which one you pass
# to `--extra`, so even having it listed would drag torch's full
# dependency tree into every `uv sync`. Install it with:
#
#   ./scripts/install-embeddings.sh
#
# Careful: since it's not declared here, running `uv sync` after
# installing it will remove it again (uv syncs the venv to exactly match
# what's declared). Just re-run the install script if that happens --
# the model weights stay cached either way, so it's fast.

[tool.pytest.ini_options]
testpaths = ["tests"]
